name: Live Mutual Fund Data Ingestion

on:
  schedule:
    - cron: '30 4 * * *' # Daily at 10:00 AM IST (04:30 UTC)
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Note: v4.1.7+ supports Node 20/24

      - name: Set up Python
        uses: actions/setup-python@v5 # Note: v5.2.0+ supports Node 20/24
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Specific install for rank_bm25 as it's our current fallback
          pip install rank_bm25

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Refresh Cycle
        run: python -m src.mf_faq.ingestion.refresh

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Daily Ingestion: $(date +'%Y-%m-%d')"
          file_pattern: '.'
          push_options: '--force'
