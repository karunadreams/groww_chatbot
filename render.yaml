services:
  - type: web
    name: hdfc-faq-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.mf_faq.ui.backend:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.9.0
